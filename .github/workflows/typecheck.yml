name: Typecheck
on:
  push:
    branches:
      - main
      - canary
  pull_request:
permissions: 
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  typecheck:
    runs-on: depot-ubuntu-22.04-2
    timeout-minutes: 10
    container:
      image: node:24-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: pnpm setup
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install packages
        run: pnpm install
      - name: Run Typecheck
        run: pnpm typecheck
        env:
          SKIP_ENV_VALIDATION: true
