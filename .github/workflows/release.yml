name: Release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  ci:
    runs-on: depot-ubuntu-22.04-8
    timeout-minutes: 15
    permissions:
      contents: read
    container:
      image: node:24-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! node -e 'process.exit(/^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1]) ? 0 : 1)' "$VERSION"; then
            echo "::error::package.json version $VERSION is not a valid semver version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              STABLE=false
              PRERELEASE="${VERSION#*-}"
              NPM_TAG="${PRERELEASE%.*}"
              ;;
            *)
              STABLE=true
              NPM_TAG=latest
              ;;
          esac
          {
            echo "version=$VERSION"
            echo "stable=$STABLE"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the version is newer than latest
        if: steps.meta.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CURRENT="$(npm view resend@latest version)"
          node -e '
            const [next, current] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            for (let i = 0; i < 3; i++) {
              if (next[i] > current[i]) process.exit(0);
              if (next[i] < current[i]) process.exit(1);
            }
            process.exit(1);
          ' "$VERSION" "$CURRENT" || {
            echo "::error::$VERSION is not newer than the current latest $CURRENT, so it must not move the latest dist-tag"
            exit 1
          }
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: true
      - name: Build
        run: pnpm build
      - name: Pack
        run: |
          mkdir -p npm-tarball
          npm pack --ignore-scripts --pack-destination npm-tarball
      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-tarball
          path: npm-tarball
          if-no-files-found: error
          retention-days: 1
  publish-npm:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-tarball
          path: npm-tarball
      - name: Verify tarball
        env:
          VERSION: ${{ needs.ci.outputs.version }}
        run: |
          TARBALL="npm-tarball/resend-$VERSION.tgz"
          if [ "$(ls -A npm-tarball)" != "resend-$VERSION.tgz" ] || [ ! -f "$TARBALL" ] || [ -L "$TARBALL" ]; then
            echo "::error::The artifact must hold only resend-$VERSION.tgz"
            exit 1
          fi
          tar -xOzf "$TARBALL" package/package.json | node -e '
            let input = "";
            process.stdin.on("data", (chunk) => { input += chunk; });
            process.stdin.on("end", () => {
              const { name, version } = JSON.parse(input);
              if (name !== "resend" || version !== process.argv[1]) {
                console.log(`::error::The tarball holds ${name}@${version}, expected resend@${process.argv[1]}`);
                process.exit(1);
              }
            });
          ' "$VERSION"
      - name: Publish to npm
        env:
          VERSION: ${{ needs.ci.outputs.version }}
          NPM_TAG: ${{ needs.ci.outputs.npm_tag }}
        run: |
          if [ "$(npm view "resend@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
            echo "resend@$VERSION is already published"
            exit 0
          fi
          npm publish "$PWD/npm-tarball/resend-$VERSION.tgz" --ignore-scripts --provenance --tag "$NPM_TAG"
  release:
    needs: [ci, publish-npm]
    runs-on: depot-ubuntu-22.04-2
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          prerelease: ${{ needs.ci.outputs.stable != 'true' }}
          make_latest: ${{ needs.ci.outputs.stable == 'true' }}
          generate_release_notes: true
