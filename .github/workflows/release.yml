name: Release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: release
  cancel-in-progress: false
permissions: {}
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      stable: ${{ steps.meta.outputs.stable }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Resolve release metadata
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if ! node -e 'process.exit(/^\d+\.\d+\.\d+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$/.test(process.argv[1]) ? 0 : 1)' "$VERSION"; then
            echo "::error::package.json version $VERSION is not a valid semver version"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"
            exit 1
          fi
          case "$VERSION" in
            *-*)
              STABLE=false
              PRERELEASE="${VERSION#*-}"
              NPM_TAG="${PRERELEASE%.*}"
              ;;
            *)
              STABLE=true
              NPM_TAG=latest
              ;;
          esac
          if [ "$STABLE" = false ] && [ "$NPM_TAG" = latest ]; then
            echo "::error::$VERSION is a prerelease, so its dist-tag cannot be latest"
            exit 1
          fi
          {
            echo "version=$VERSION"
            echo "stable=$STABLE"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"
      - name: Verify the version is newer than latest
        if: steps.meta.outputs.stable == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          CURRENT="$(npm view resend@latest version)"
          node -e '
            const [next, current] = process.argv.slice(1).map((v) => v.split(".").map(Number));
            for (let i = 0; i < 3; i++) {
              if (next[i] > current[i]) process.exit(0);
              if (next[i] < current[i]) process.exit(1);
            }
            process.exit(1);
          ' "$VERSION" "$CURRENT" || {
            echo "::error::$VERSION is not newer than the current latest $CURRENT, so it must not move the latest dist-tag"
            exit 1
          }
      - name: Verify the release commit is on canary and main
        if: steps.meta.outputs.stable == 'true'
        run: |
          for branch in canary main; do
            if ! git rev-parse --verify --quiet "refs/remotes/origin/$branch" >/dev/null; then
              echo "::error::origin/$branch is missing from the checkout. Keep fetch-depth: 0 on actions/checkout."
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD "refs/remotes/origin/$branch"; then
              echo "::error::Tag $GITHUB_REF_NAME is not on $branch. Merge the release into canary, promote canary to main, delete the tag, then tag main again."
              exit 1
            fi
          done
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
        env:
          SKIP_ENV_VALIDATION: true
      - name: Build
        run: pnpm build
  publish-npm:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish to npm
        env:
          NPM_TAG: ${{ needs.ci.outputs.npm_tag }}
        run: npm publish --provenance --tag "$NPM_TAG"
  release:
    needs: [ci, publish-npm]
    runs-on: depot-ubuntu-22.04-2
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          prerelease: ${{ needs.ci.outputs.stable != 'true' }}
          make_latest: ${{ needs.ci.outputs.stable == 'true' }}
          generate_release_notes: true
